# infra_cod: runtime accounts an update brings (sprint C K2).
#
# The installer makes every runtime account with useradd. An update does not
# run the installer, so a runtime added after install comes with tmpfiles rules
# naming a user the host does not have; the update coordinator runs
# systemd-sysusers on this file before those rules (install-reconcile.mjs).
# An account that exists is left as it is. The home and its state directories
# are tmpfiles' (infra-cod-runtime-homes.conf).
u claude-worker - "infra_cod Claude Code runtime" /home/claude-worker /usr/sbin/nologin
