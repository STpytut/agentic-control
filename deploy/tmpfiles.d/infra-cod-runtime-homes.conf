# infra_cod: the runtime agents' home directories.
#
# These are not a convenience. `infra-cod-runtime-supervisor.service` names them
# in ReadWritePaths and ReadOnlyPaths, and systemd resolves those paths while it
# is building the unit's mount namespace — before ExecStart. A path that does not
# exist is not skipped: the unit fails with
#
#   Failed to set up mount namespacing: /home/codex-worker/.codex: No such file or
#   directory (status=226/NAMESPACE)
#
# which is why a clean installation could never start the supervisor at all. The
# installer creating the accounts is not enough; `useradd --create-home` makes
# the home, not the per-agent state directories inside it.
#
# They live here rather than in install.sh so that `systemd-tmpfiles --create`
# recreates them after a cleanup, a tmpfiles-driven wipe or an operator's
# `rm -rf`, which is exactly when a missing one would otherwise be found by a
# unit that refuses to start.

# Codex CLI state, owned by the runtime user that runs Codex.
d /home/codex-worker            0750 codex-worker      codex-worker      -
d /home/codex-worker/.codex     0700 codex-worker      codex-worker      -

# OpenCode state, and the read-only tool directory the supervisor mounts.
d /home/opencode-worker                          0750 opencode-worker opencode-worker -
d /home/opencode-worker/.local                   0700 opencode-worker opencode-worker -
# OpenCode caches models.dev here when it is launched in a workspace: that path
# sets no XDG variables, so the default `~/.cache` applies. The directory has to
# exist and be the runtime's own before the sandbox grants it.
d /home/opencode-worker/.cache                   0700 opencode-worker opencode-worker -
d /home/opencode-worker/.cache/opencode          0700 opencode-worker opencode-worker -
d /home/opencode-worker/.config                  0700 opencode-worker opencode-worker -
d /home/opencode-worker/.config/opencode         0700 opencode-worker opencode-worker -
d /home/opencode-worker/.config/opencode/tools   0755 opencode-worker opencode-worker -

# Claude Code state (sprint C K2): the login and the sessions in `.claude`, and
# the account file beside it, which the supervisor lets it write and systemd
# can only mount if it exists — so `f` makes it, empty JSON, and never touches
# one that is there.
d /home/claude-worker            0750 claude-worker claude-worker -
d /home/claude-worker/.claude    0700 claude-worker claude-worker -
f /home/claude-worker/.claude.json 0600 claude-worker claude-worker - {}
