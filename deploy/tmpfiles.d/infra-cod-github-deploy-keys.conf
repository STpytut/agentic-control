# infra_cod: project-scoped GitHub deploy keys root.
# Required to exist before infra-cod-runtime-supervisor.service starts so the
# supervisor's ReadWritePaths mount succeeds and deprovision_project can remove
# project key material. Owner root:infra-control mode 0750 (the key files
# themselves are created 0600 by the provisioner).
d /etc/infra-cod/github-deploy-keys 0750 root infra-control -

# infra_cod: the GitHub App's private key directory.
#
# Named in infra-cod-github-app-worker.service as a ReadOnlyPaths mount, which
# systemd resolves before ExecStart — so if this directory is missing the worker
# fails with status=226/NAMESPACE rather than starting and reporting a missing
# key. The installer creates it too; this entry is what puts it back after a
# cleanup, which is the moment its absence would otherwise be discovered by a
# unit that refuses to start.
d /etc/infra-cod/github-app 0750 root infra-cod-github -
