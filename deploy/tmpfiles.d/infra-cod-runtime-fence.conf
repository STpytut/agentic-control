# The runtime fence.
#
# An installation takes an exclusive lock on a file here; every runtime launch
# takes a shared one. That is what stops a runtime's version changing while a
# process is using it, and what stops a launch beginning mid-switch.
#
# It is NOT under /run/infra-cod. That is the supervisor's RuntimeDirectory, and
# systemd deletes it when the unit stops: the lock would survive on an unlinked
# inode while a restarted supervisor took a lock on a brand-new file at the same
# path — two holders, no exclusion, and the fence missing at the one moment it
# was needed. This directory belongs to no unit's lifecycle.
d /var/lib/infra-cod 0755 root root -
d /var/lib/infra-cod/runtime-fence 0755 root root -
