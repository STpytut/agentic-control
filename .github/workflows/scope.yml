# What a change actually touches.
#
# The heavy jobs — a two-hour release build, a two-hour end-to-end install —
# exist to catch breakage in the product. A pull request that edits prose cannot
# break either of them, and spending four hours of runner time proving that is
# not caution, it is noise that makes a red result easier to ignore.
#
# So the paths that matter are named here, in one place, and named as an
# *exclusion*: everything is code unless it is documentation. A new directory is
# therefore covered by default, which is the safe direction to be wrong in — the
# alternative is an allowlist that silently stops testing whatever somebody adds
# next.

name: scope

on:
  workflow_call:
    outputs:
      code:
        description: "true when the change touches anything other than documentation"
        value: ${{ jobs.scope.outputs.code }}

permissions:
  contents: read

jobs:
  scope:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: decide
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          # Anything that is not a pull request — `main`, a tag — is code by
          # definition: there is no base to compare against, and those refs are
          # exactly the ones that must always be built.
          if [ -z "${BASE:-}" ]; then
            echo "not a pull request; treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if [ -z "$CHANGED" ]; then
            echo "no files changed; treating as code so an empty diff never skips a gate"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # Documentation only. `docs/`, top-level Markdown, and the ADRs.
          # Everything else — including .github/, deploy/, db/ and anything new —
          # counts as code.
          CODE=$(echo "$CHANGED" | grep -vE '^(docs/|[^/]*\.md$)' || true)
          if [ -z "$CODE" ]; then
            echo "documentation only"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code changes:"
            echo "$CODE" | sed 's/^/  /'
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
